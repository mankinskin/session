[package]
name = "session"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
cli = ["dep:chrono", "dep:clap", "dep:memory-kernel", "dep:serde", "dep:serde_json", "dep:session-api", "dep:thiserror", "dep:toon-format", "dep:uuid"]
mcp = ["dep:chrono", "dep:memory-kernel", "dep:rmcp", "dep:serde", "dep:serde_json", "dep:session-api", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]
capture-hook = ["dep:memory-kernel", "dep:serde_json", "dep:session-api", "dep:session-worktree-provision", "dep:session-workspace-resolver", "dep:ticket-api", "dep:tracing", "dep:tracing-appender", "dep:tracing-subscriber"]

[[bin]]
name = "session"
path = "src/bin/session.rs"
required-features = ["cli"]

[[bin]]
name = "session-mcp"
path = "src/bin/session-mcp.rs"
required-features = ["mcp"]

[[bin]]
name = "session-capture-hook"
path = "src/bin/session-capture-hook/main.rs"
required-features = ["capture-hook"]

[lib]
path = "src/lib.rs"

[dependencies]
session-api = { path = "crates/session-api", optional = true }
session-worktree-provision = { path = "crates/session-worktree-provision", optional = true }
session-workspace-resolver = { path = "crates/session-workspace-resolver", optional = true }
ticket-api = { git = "https://github.com/mankinskin/ticket", branch = "main", optional = true }
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
clap = { version = "4", features = ["derive"], optional = true }
rmcp = { version = "0.14", features = ["server", "transport-io"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
toon-format = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
tracing-appender = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "1", features = ["serde", "v4"], optional = true }

[dev-dependencies]
memory-fixtures = { git = "https://github.com/mankinskin/memory-fixtures", branch = "main" }
pretty_assertions = "1"
rule-api = { git = "https://github.com/mankinskin/rule", branch = "main" }
tempfile = "3"

[[test]]
name = "copilot_capture_hook_e2e"
path = "tests/copilot_capture_hook_e2e.rs"
required-features = ["capture-hook"]

[[test]]
name = "copilot_stop_hook_e2e"
path = "tests/copilot_stop_hook_e2e.rs"
required-features = ["capture-hook"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]
