[package]
name = "session-api"
version = "0.1.0"
edition = "2024"
description = "Copilot session capture models and store-layout planning for memory-api-backed persistence"

[lib]
name = "session_api"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
feedback-api = { git = "https://github.com/mankinskin/feedback", branch = "main" }
git2 = "0.20"
memory-kernel = { git = "https://github.com/mankinskin/memory-kernel", branch = "main" }
rule-api = { git = "https://github.com/mankinskin/rule", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spec-api = { git = "https://github.com/mankinskin/spec", branch = "main" }
test-api = { git = "https://github.com/mankinskin/test", branch = "main" }
ticket-api = { git = "https://github.com/mankinskin/ticket", branch = "main" }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
